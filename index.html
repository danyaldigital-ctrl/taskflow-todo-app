<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>TaskFlow</h1>
            <p>Simple task management made easy</p>
        </div>

        <div class="input-section">
            <input
                type="text"
                id="taskInput"
                placeholder="What do you need to do?"
            >

            <button id="addTaskBtn">Add Task</button>
        </div>

        <div class="task-info">
    <div>
        <span id="taskCount">0 tasks remaining</span>
        <span id="completedCount"> | 0 completed</span>
    </div>

    <button id="clearCompleted">
        Clear Completed
    </button>
</div>

        <div id="taskList" class="task-list">
            <div class="empty-message">
                <p>No tasks yet.</p>
                <span>Add your first task above!</span>
            </div>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
